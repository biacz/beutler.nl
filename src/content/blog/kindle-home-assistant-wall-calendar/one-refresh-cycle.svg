<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
  <title id="t">One refresh cycle</title>
  <desc id="d">Timeline of one refresh cycle. The Kindle is awake for about 11 minutes and draws the calendar. Then powerd announces readyToSuspend; only at this moment does it accept a wake request, so the script sets rtcWakeup to the seconds until the next refresh. The Kindle sleeps for hours at about 2 milliamps. The hardware clock wakes it about 9 seconds early, the script presses a virtual button with wakeUp 1, Wi-Fi is back after about 7 seconds and the calendar is drawn again.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #e5e5e5; }
    .h { font: 700 15px Inter, 'Segoe UI', system-ui, sans-serif; fill: #1d1e21; }
    .lane { font: 600 11px Inter, 'Segoe UI', system-ui, sans-serif; fill: #5b5e66; letter-spacing: .06em; }
    .b { font: 600 12.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #1d1e21; }
    .s { font: 400 11.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #5b5e66; }
    .w { font: 600 12.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #ffffff; }
    .m { font: 600 12px 'JetBrains Mono', Consolas, monospace; fill: #1f4e8c; }
    .awake { fill: #1f4e8c; }
    .sleep { fill: #3d3f45; }
    .chip { fill: #e8eef7; stroke: #1f4e8c; }
    .moment { stroke: #a62c21; stroke-width: 2; }
    .mt { font: 700 12.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #a62c21; }
    .lanebg { fill: #fafaf9; }
    .link { stroke: #a62c21; stroke-width: 1.5; stroke-dasharray: 3 3; }
    .brk { stroke: #ffffff; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1d21; stroke: #2f3137; }
      .h, .b { fill: #e7e7e4; }
      .lane, .s { fill: #a3a6ad; }
      .w { fill: #141518; }
      .m { fill: #8db4ec; }
      .awake { fill: #8db4ec; }
      .sleep { fill: #4a4c53; }
      .chip { fill: #22324a; stroke: #8db4ec; }
      .moment, .link { stroke: #e8705f; }
      .mt { fill: #e8705f; }
      .lanebg { fill: #202126; }
      .brk { stroke: #1c1d21; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="759" height="329" rx="12"/>
  <text class="h" x="24" y="36">One refresh cycle</text>


  <!-- lane backgrounds -->
  <rect class="lanebg" x="16" y="84" width="728" height="64" rx="8"/>
  <rect class="lanebg" x="16" y="160" width="728" height="96" rx="8"/>

  <!-- the moment marker 1 -->
  <line class="moment" x1="288" y1="70" x2="288" y2="250"/>
  <text class="mt" x="288" y="62" text-anchor="middle">readyToSuspend</text>
  <!-- marker 2 -->
  <line class="moment" x1="560" y1="70" x2="560" y2="250" style="stroke-dasharray:4 4"/>
  <text class="mt" x="560" y="62" text-anchor="middle">RTC alarm</text>

  <!-- powerd lane -->
  <text class="lane" x="28" y="121">POWERD</text>
  <rect class="awake" x="118" y="98" width="168" height="36" rx="6"/>
  <text class="w" x="202" y="121" text-anchor="middle">awake ~11 min</text>
  <rect class="sleep" x="290" y="98" width="268" height="36" rx="6"/>
  <text class="w" x="424" y="121" text-anchor="middle" style="fill:#fff">asleep for hours · ~2 mA</text>
  <line class="brk" x1="530" y1="96" x2="520" y2="136"/>
  <line class="brk" x1="538" y1="96" x2="528" y2="136"/>
  <rect class="awake" x="562" y="98" width="168" height="36" rx="6"/>
  <text class="w" x="646" y="121" text-anchor="middle">awake ~11 min</text>

  <!-- script lane -->
  <text class="lane" x="28" y="208">SCRIPT</text>
  <text class="s" x="202" y="190" text-anchor="middle">draws the calendar,</text>
  <text class="s" x="202" y="206" text-anchor="middle">writes next target time</text>

  <rect class="chip" x="296" y="176" width="226" height="30" rx="7"/>
  <text class="m" x="409" y="196" text-anchor="middle">rtcWakeup &lt;secs to 18:00&gt;</text>
  <text class="s" x="409" y="226" text-anchor="middle">first thing, nothing else</text>
  <line class="link" x1="288" y1="191" x2="296" y2="191"/>

  <rect class="chip" x="568" y="176" width="112" height="30" rx="7"/>
  <text class="m" x="624" y="196" text-anchor="middle">wakeUp 1</text>
  <text class="s" x="568" y="226">Wi-Fi back in ~7 s,</text>
  <text class="s" x="568" y="242">then draw again</text>

  <!-- footnotes -->
  <text class="b" x="24" y="286">Ask a moment earlier or later and powerd answers “invalid state”.</text>
  <text class="s" x="24" y="306">The RTC alarm fires about 9 s early – the script counts that as on time, or it would draw the same refresh twice.</text>
</svg>
