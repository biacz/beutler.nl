<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-labelledby="t d">
  <title id="t">The only way a mail can leave</title>
  <desc id="d">Five steps in a row. Claude Haiku returns text and never touches the mail provider. I edit the text. A click on Send it is the only route that approves it. The server stores a pending row and waits ten seconds, during which undo cancels it. Then one atomic update claims the row so it can't send twice, and only then does Gmail send it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b5e66"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #ffffff; stroke: #e5e5e5; }
    .box { fill: #fafaf9; stroke: #d9d9d6; }
    .key { fill: #fbf1ef; stroke: #a62c21; }
    .h { font: 700 15px Inter, 'Segoe UI', system-ui, sans-serif; fill: #1d1e21; }
    .sub { font: 400 12.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #5b5e66; }
    .b { font: 600 13px Inter, 'Segoe UI', system-ui, sans-serif; fill: #1d1e21; }
    .s { font: 400 11.5px Inter, 'Segoe UI', system-ui, sans-serif; fill: #5b5e66; }
    .lane { font: 600 11px Inter, 'Segoe UI', system-ui, sans-serif; fill: #5b5e66; }
    .l { stroke: #5b5e66; stroke-width: 1.4; fill: none; }
    .m { text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1d21; stroke: #2f3137; }
      .box { fill: #23252a; stroke: #3a3c43; }
      .key { fill: #2e1d1b; stroke: #e8705f; }
      .h, .b { fill: #e7e7e4; }
      .sub, .s, .lane { fill: #a3a6ad; }
      .l { stroke: #c9cacd; }
      marker path { fill: #c9cacd; }
    }
  </style>
  <rect class="bg" x=".5" y=".5" width="759" height="229" rx="8"/>
  <text class="h" x="20" y="28">The only way a mail can leave</text>
  <text class="sub" x="20" y="47">The model is left of the line and has no route to the mail provider.</text>

  <rect class="box" x="20" y="76" width="128" height="88" rx="6"/>
  <text class="b m" x="84" y="108">Haiku</text>
  <text class="s m" x="84" y="128">returns text,</text>
  <text class="s m" x="84" y="144">nothing else</text>

  <rect class="box" x="168" y="76" width="128" height="88" rx="6"/>
  <text class="b m" x="232" y="108">Me</text>
  <text class="s m" x="232" y="128">read, edit, fill the</text>
  <text class="s m" x="232" y="144">[placeholders]</text>

  <rect class="key" x="316" y="76" width="128" height="88" rx="6"/>
  <text class="b m" x="380" y="108">Send it</text>
  <text class="s m" x="380" y="128">a click, on the</text>
  <text class="s m" x="380" y="144">only route to it</text>

  <rect class="box" x="464" y="76" width="128" height="88" rx="6"/>
  <text class="b m" x="528" y="108">10 s undo</text>
  <text class="s m" x="528" y="128">pending row,</text>
  <text class="s m" x="528" y="144">timer on the server</text>

  <rect class="box" x="612" y="76" width="128" height="88" rx="6"/>
  <text class="b m" x="676" y="108">Gmail</text>
  <text class="s m" x="676" y="128">atomic claim, so it</text>
  <text class="s m" x="676" y="144">can't send twice</text>

  <path class="l" marker-end="url(#a)" d="M148 120 H168"/>
  <path class="l" marker-end="url(#a)" d="M296 120 H316"/>
  <path class="l" marker-end="url(#a)" d="M444 120 H464"/>
  <path class="l" marker-end="url(#a)" d="M592 120 H612"/>
  <path d="M158 62 V190" stroke="#a62c21" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text class="lane" x="20" y="202">MODEL</text>
  <text class="lane" x="170" y="202">PLAIN CODE AND ME</text>
</svg>
