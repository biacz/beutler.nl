name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild: refreshes project stats on /ai/ and picks up anything missed.
  schedule:
    - cron: '17 4 * * *'
  # New, edited or deleted comments: rebuild so they show up under the post within minutes.
  discussion_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read comments; create the comment thread (discussion) for new posts.
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the changelog page.
          fetch-depth: 0
          persist-credentials: false

      - name: Create comment threads for new posts
        # Never block a deploy because of comments.
        continue-on-error: true
        run: node scripts/sync-discussions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install, build and upload site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          node-version: 24
        env:
          # Build-time reads only: comments and repo stats.
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
