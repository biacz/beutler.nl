# Link checker settings (weekly-checks.yml). https://lychee.cli.rs
max_retries = 2
timeout = 20
# Many sites rate-limit or block bots; those aren't broken links.
accept = ["200..=299", "403", "429"]
# Home-network addresses and placeholders in old tutorials.
exclude_all_private = true
# Only external links: internal links and images are checked on the built site in ci.yml.
# (Root-relative links like /blog/x/ are resolved against --root-dir, then skipped here.)
scheme = ["http", "https"]
exclude = [
  '^https?://(www\.)?example\.(com|org)',
  '^https?://localhost',
  '^https?://([a-z0-9-]+\.)?linkedin\.com',
  '^https?://web\.archive\.org',
  # API example with a placeholder token in the PowerApps/GitLab post.
  '^https?://(www\.)?gitlab\.com/api/',
]
