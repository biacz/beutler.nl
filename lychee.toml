# Link checker settings (weekly-checks.yml). https://lychee.cli.rs
max_retries = 2
timeout = 20
# Many sites rate-limit or block bots; those aren't broken links.
accept = ["200..=299", "403", "429"]
# Home-network addresses and placeholders in old tutorials.
exclude_all_private = true
exclude = [
  '^https?://(www\.)?example\.(com|org)',
  '^https?://localhost',
  '^https?://([a-z0-9-]+\.)?linkedin\.com',
  '^https?://web\.archive\.org',
]
